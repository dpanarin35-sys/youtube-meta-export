<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Channel Meta Exporter — OAuth evidence</title>
    <style>
      @page { size: A4 landscape; margin: 12mm; }
      * { box-sizing: border-box; }
      body { color: #172033; font-family: Arial, sans-serif; margin: 0; }
      section { break-after: page; page-break-after: always; }
      section:last-child { break-after: auto; page-break-after: auto; }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { color: #4b5565; font-size: 12px; line-height: 1.4; margin: 0 0 12px; }
      img { display: block; height: 156mm; max-width: 100%; object-fit: contain; object-position: left top; width: 100%; }
    </style>
  </head>
  <body>
    <section>
      <h1>OAuth consent screen</h1>
      <p>Google consent screen shows the requested YouTube access. The account email has been redacted.</p>
      <img src="screenshots/oauth-consent-current-redacted.png" alt="Google OAuth consent screen with requested YouTube access" />
    </section>
    <section>
      <h1>In-product access revocation</h1>
      <p>After authentication, the application provides the action “Revoke access and delete data”. Channel-specific details have been redacted.</p>
      <img src="screenshots/revoke-access-current-redacted.png" alt="Signed-in application screen with the access revocation action" />
    </section>
  </body>
</html>
